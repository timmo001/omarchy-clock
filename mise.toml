min_version = "2025.1.0"

[tools]
node = "26.13.1"
# The linters the shared hk pre-push hook runs.
uv = "0.13.10"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"npm:prettier" = "3.10.1"

[tasks.format]
description = "Format the Markdown, JSON and YAML files"
run = "prettier --write ."

[tasks."format:check"]
description = "Check formatting without writing"
run = "prettier --check ."

[tasks.check]
depends = ["validate", "lint", "format:check"]

[tasks.validate]
run = "omarchy plugin validate ."

[tasks.lint]
run = "/usr/lib/qt6/bin/qmllint -I /usr/lib/qt6/qml --import disable --unqualified disable BarWidget.qml Panel.qml PanelFlickable.qml WorldClocks.qml"
